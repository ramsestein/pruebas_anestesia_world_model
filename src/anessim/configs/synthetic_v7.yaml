n_cases: 10000
random_seed: 42
dt_seconds: 0.5
policy_fraction: 0.75
include_llm_text: false
output_dir: data/synthetic_v7
cases_dir: data/real/cases
clinical_path: data/real/clinical_data_enriched.parquet
labs_path: data/real/lab_data.parquet
n_workers: 8
resume: true
# Modelo del sorteo inicial de BT: "v7_normal" reproduce los datos v7 vigentes.
# "uniform_c3_revert" es la corrección C3 pendiente de la regeneración GLOBAL.
bt_start_model: v7_normal
